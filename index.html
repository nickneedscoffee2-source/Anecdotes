<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; img-src data:">
<title>Anecdotal assistant</title>
<style>
:root{--bg:#EDF2F4;--card:#fff;--ink:#14212B;--mute:#5A6A75;--line:#D3DCE1;--acc:#0E7C86;--accbg:#DCF0F1;--t:#2F5BD3;--tbg:#E3EAFB;--s:#A45F00;--sbg:#FBEBCF;--rec:#C93434}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px}
.brand{font-weight:700;font-size:18px;margin-right:auto}
header input{background:#22333F;border:1px solid #3A4E5C;color:#fff;border-radius:10px;padding:8px 12px;width:170px;font:inherit}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.78}}@media(prefers-reduced-motion:reduce){.btn.rec{animation:none}}
.btn.sm{padding:3px 9px;font-size:13px;font-weight:500}
:focus-visible{outline:3px solid #7CC4CB;outline-offset:2px}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}
nav button{border:0;background:none;padding:10px 16px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{padding:16px 20px 60px;max-width:1150px;margin:0 auto}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:16px}.grid2{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
.empty{color:var(--mute);text-align:center;padding:36px 16px}
.tx{min-height:300px;max-height:56vh;overflow:auto;margin-bottom:12px}
.ln{display:flex;gap:8px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line)}
.ln .tx-t{flex:1}.int{color:var(--mute);font-style:italic;padding:8px 6px}
.b{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px}
.b.T{background:var(--tbg);color:var(--t)}.b.S{background:var(--sbg);color:var(--s)}
.who{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px}.row input,.row select{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--accbg);border-color:var(--acc);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.box h3{margin:0 0 6px}
.list{padding:8px}.it{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
.it.on{background:var(--accbg);font-weight:700}.it small{color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:6px 12px;font:inherit;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.mk{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.dots{display:flex;gap:5px}.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;padding:0}
.dot.on{background:var(--acc);border-color:var(--acc)}.dot.sug{border:2px dashed var(--acc)}
.ent{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}.ent .tx-t{flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.cols{grid-template-columns:1fr}}
.cols .card{border-top:5px solid var(--acc)}.cols .card.n{border-top-color:var(--s)}
.item{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;color:var(--mute)}
#tag{position:fixed;display:none;gap:6px;background:var(--ink);padding:6px;border-radius:12px;z-index:9}
#tag button{border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
svg text{font-size:13px;fill:var(--ink)}.note{color:var(--mute);font-size:14px}
.convo{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}.convo .tx{flex:1;margin-bottom:0;min-width:0}
.mic{width:78px;flex:none;writing-mode:vertical-rl;font-size:19px;letter-spacing:.05em;border-radius:14px;min-height:300px}
.mic.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media(max-width:800px){.convo{flex-direction:column-reverse}.mic{writing-mode:horizontal-tb;width:100%;min-height:0;padding:14px}}
.ai{background:var(--accbg);border-radius:12px;padding:4px 14px 12px;margin:8px 0}.ai ul{margin:4px 0;padding-left:20px}.ai .item{border-color:#B9DDE0}
#tag{flex-wrap:wrap;max-width:360px}.icon{border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;border-radius:8px;flex:none;display:inline-flex;align-self:flex-start}.icon:hover{background:#FBE3E3;color:var(--rec)}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}}
</style></head><body>
<header><div class="brand">Anecdotal assistant</div>
<input id="subj" list="subs" aria-label="Subject" placeholder="Subject"><datalist id="subs"><option>Writing<option>Reading<option>Math<option>Science<option>Social Studies<option>Other</datalist>
<span id="sync" style="color:#9FB3C0;font-size:13px"></span><button id="cap" class="btn"></button></header>
<nav id="nav"></nav><main id="main"></main>
<div id="tag"></div>
<div id="toast"></div>
<script>
const KEY='anecdotal-v1',$=s=>document.querySelector(s);
const fresh=()=>({roster:[],lines:[],marks:{},items:{},ai:{},idYear:null,idLast:0,codes:{},n:0,sync:{url:'',key:''},aiOn:true,subject:'Writing',mode:'dots',hide:false});
let syncT,syncing=false;
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)))}catch(e){S=fresh()}

const uid=()=>Math.random().toString(36).slice(2,9),day=()=>new Date().toLocaleDateString('en-CA');
const fd=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const nm=s=>!s?'(removed)':S.hide?s.name.split(/\s+/).map(w=>w[0]).join('.')+'.':s.name;
const stu=id=>S.roster.find(r=>r.id===id);
const empty=t=>h('div',{class:'card empty'},t);
const short=(t,n=14)=>{const w=t.split(/\s+/);return w.slice(0,n).join(' ')+(w.length>n?'…':'')};

const CATS=[['participation','Participation'],['knowledge','Knowledge'],['application','Application'],['thinking','Thinking'],['communication','Communication']];
const KW={knowledge:/\b(know|knows|because|means|learned|fact|remember|correct|right)\b/i,application:/\b(use|used|apply|applied|example|try|tried|add|added|revise|edit|edited)\b/i,thinking:/\b(why|think|thought|predict|compare|maybe|idea|reason|wonder|what if)\b/i,communication:/\b(explain|explained|tell|told|describe|share|shared|said|show)\b/i};
const TYPES={L:'Learned',S:'Strength',G:'Growth',N:'Next step'};
let view='live',selS=null,active=[],capturing=false,listening=false,rec=null,interim='',selIds=[],mapRange=0;

/* ---------- listening ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startMic(){
 if(!SR){toast('Speech recognition needs Chrome or Edge. You can still type notes.');return}
 rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-CA';
 rec.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const r=e.results[n];if(r.isFinal)f+=r[0].transcript;else i+=r[0].transcript}
  interim=capturing?i:'';if(f.trim())handle(f.trim());renderLive()};
 rec.onend=()=>{if(listening)try{rec.start()}catch(e){}};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;capturing=false;syncBar();toast('Microphone is blocked. Allow it in the address bar.')}};

function stopMic(){listening=false;capturing=false;interim='';try{rec.stop()}catch(e){}syncBar();renderLive();autoAnalyze()}
function toggleCap(){capturing=!capturing;interim='';toast(capturing?'Capturing started':'Capturing stopped');syncBar();renderLive();if(!capturing)autoAnalyze()}
function handle(t){t.split(/sound\s?garden/ig).forEach((p,i)=>{if(i>0)toggleCap();if(capturing&&p.trim())addText(p.trim())})}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function findNames(t){const first={};S.roster.forEach(s=>{const f=s.name.split(/\s+/)[0].toLowerCase();first[f]=(first[f]||0)+1});
 return S.roster.filter(s=>{const f=s.name.split(/\s+/)[0].toLowerCase(),k=[s.name.toLowerCase().replace(/[.\s]+$/,'')];if(first[f]===1)k.push(f);return k.some(x=>new RegExp('\\b'+esc(x)+'\\b','i').test(t))}).map(s=>s.id)}
function guess(t,named){const last=S.lines[S.lines.length-1];
 if(named||/\?\s*$/.test(t)||/^(ok|okay|so|tell me|show me|what|why|how|can you|great|nice|good|i like|i see|try|remember)\b/i.test(t))return'T';
 return last?(last.who==='T'?'S':last.who):'T'}
function addText(t){const ids=findNames(t);const who=guess(t,ids.length>0);if(ids.length)active=ids;
 S.lines.push({id:uid(),date:day(),subject:S.subject,who,text:t,students:[...active],sp:who==='S'&&active.length===1?active[0]:undefined});save();renderLive()}
function suggest(ls,sid){const o={participation:Math.min(4,ls.filter(l=>l.who==='S'&&(!l.sp||l.sp===sid)).length)};
 CATS.slice(1).forEach(([c])=>o[c]=Math.min(4,ls.filter(l=>KW[c].test(l.text)).length));return o}

/* ---------- chrome ---------- */
function syncBar(){const m=$('#mic'),c=$('#cap');
 if(m){m.textContent=listening?'Stop listening':'Start listening';m.className='btn mic '+(listening?'on':'pri')}
 c.disabled=!listening;c.textContent=capturing?'Capturing — tap to pause':'Paused — say “Soundgarden”';c.className='btn '+(capturing?'rec':'')}
$('#cap').onclick=toggleCap;
$('#subj').value=S.subject;$('#subj').oninput=e=>{S.subject=e.target.value.replace(/\|/g,'').trim()||'General';save()};
const NAV=[['live','Live'],['students','Students'],['parent','Parent call'],['map','Map'],['settings','Settings']];
NAV.forEach(([v,l])=>$('#nav').append(h('button',{dataset:{v},onclick:()=>{view=v;render()}},l)));
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 const m=$('#main');m.replaceChildren();if(newYearDue())m.append(yearBanner());({live:vLive,students:vStudents,parent:vParent,map:vMap,settings:vSettings})[view](m);syncBar()}

/* ---------- live ---------- */
function vLive(m){
 if(!S.roster.length)m.append(h('div',{class:'card'},'Start by adding your class list in ',h('button',{class:'btn sm',onclick:()=>{view='settings';render()}},'Settings'),'.'));
 m.append(h('div',{class:'grid'},
  h('section',{class:'card'},h('h2',{},'Conversation'),h('div',{class:'convo'},h('div',{id:'tx',class:'tx'}),h('button',{id:'mic',class:'btn mic','aria-label':'Start or stop listening',onclick:()=>listening?stopMic():startMic()})),
   h('div',{class:'row'},h('input',{id:'typed',placeholder:'Or type a note…','aria-label':'Type a note',onkeydown:e=>{if(e.key==='Enter')typed()}}),h('button',{class:'btn',onclick:typed},'Add note')),
   h('p',{class:'note'},'Highlight text to mark it as Teacher said or Student said.')),
  h('section',{},h('div',{class:'card'},h('h2',{},'Who is in this conversation'),h('div',{id:'chips',class:'chips'})),h('div',{id:'boxes'}))));
 renderLive()}
function typed(){const i=$('#typed'),v=i.value.trim();if(v){addText(v);i.value=''}}
function renderLive(){if(view!=='live'||!$('#tx'))return;
 const td=S.lines.filter(l=>l.date===day()),tx=$('#tx');tx.replaceChildren();
 if(!td.length&&!interim)tx.append(h('div',{class:'empty'},listening?'Say “Soundgarden” to start capturing.':'Press Start listening, or type a note below.'));
 td.forEach(l=>tx.append(h('div',{class:'ln',dataset:{id:l.id}},h('span',{class:'b '+l.who},spk(l)),
  h('div',{class:'tx-t'},l.text,h('div',{class:'who'},l.students.length?l.students.map(i=>nm(stu(i))).join(', '):h('button',{class:'btn sm',onclick:()=>{l.students=[...active];save();renderLive()}},'Assign to selected students'))),h('button',{class:'icon noprint','aria-label':'Delete this line',title:'Delete this line',onclick:()=>delLine(l.id)},trash()))));
 if(interim)tx.append(h('div',{class:'int'},interim));tx.scrollTop=tx.scrollHeight;
 $('#chips').replaceChildren(...S.roster.map(s=>h('button',{class:'chip'+(active.includes(s.id)?' on':''),'aria-pressed':active.includes(s.id),onclick:()=>{active=active.includes(s.id)?active.filter(x=>x!==s.id):[...active,s.id];renderLive()}},nm(s))));
 $('#boxes').replaceChildren(...active.map(id=>{const ls=td.filter(l=>l.students.includes(id)).slice(-5);
  return h('div',{class:'box'},h('h3',{},nm(stu(id))),ls.length?ls.map(l=>h('div',{class:'ent'},h('span',{class:'b '+l.who},l.who==='T'?'T':(l.sp?spk(l):'S')),h('div',{class:'tx-t'},short(l.text,22)))):h('span',{class:'note'},'Waiting for comments…'))}))}

/* highlight to tag */
function checkSel(){const t=$('#tag'),sel=getSelection();selIds=[];
 if(view==='live'&&sel.rangeCount&&!sel.isCollapsed)selIds=[...document.querySelectorAll('#tx .ln')].filter(e=>sel.containsNode(e,true)).map(e=>e.dataset.id);
 if(!selIds.length){t.style.display='none';return}
 const r=sel.getRangeAt(0).getBoundingClientRect();tagMenu(false);t.style.display='flex';t.style.top=Math.max(8,r.top-t.offsetHeight-8)+'px';t.style.left=Math.max(8,Math.min(innerWidth-370,r.left))+'px'}
const inTag=e=>e.target.closest&&e.target.closest('#tag');document.addEventListener('mouseup',e=>{if(!inTag(e))setTimeout(checkSel,0)});document.addEventListener('touchend',e=>{if(!inTag(e))setTimeout(checkSel,300)});document.addEventListener('keyup',checkSel);
$('#tag').addEventListener('mousedown',e=>e.preventDefault());
function tagMenu(all){const t=$('#tag');let ids=[];
 S.lines.forEach(l=>{if(selIds.includes(l.id))l.students.forEach(x=>{if(!ids.includes(x))ids.push(x)})});active.forEach(x=>{if(!ids.includes(x))ids.push(x)});
 const full=all||!ids.length,list=S.roster.filter(r=>full||ids.includes(r.id));
 t.replaceChildren(h('button',{style:'background:#E3EAFB;color:#2F5BD3',dataset:{w:'T'}},'Teacher said'),
  list.map(r=>h('button',{style:'background:#FBEBCF;color:#A45F00',dataset:{w:'S',sid:r.id}},nm(r)+' said')),
  S.roster.length?null:h('button',{style:'background:#FBEBCF;color:#A45F00',dataset:{w:'S'}},'Student said'),
  full?null:h('button',{style:'background:#fff;color:#14212B',dataset:{more:'1'}},'Someone else…'))}
$('#tag').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.more){tagMenu(true);return}
 const w=b.dataset.w,sid=b.dataset.sid;if(!w)return;
 S.lines.forEach(l=>{if(selIds.includes(l.id)){l.who=w;l.manual=1;if(w==='T'||!sid)delete l.sp;else{l.sp=sid;if(!l.students.includes(sid))l.students.push(sid)}}});
 save();getSelection().removeAllRanges();$('#tag').style.display='none';renderLive()});

/* ---------- students ---------- */
function vStudents(m){
 if(!S.roster.length)return m.append(empty('Add your class list in Settings first.'));
 if(!stu(selS))selS=S.roster[0].id;
 m.append(h('div',{class:'grid2'},h('div',{class:'card list'},S.roster.map(s=>h('button',{class:'it'+(s.id===selS?' on':''),onclick:()=>{selS=s.id;render()}},nm(s),h('small',{},S.lines.filter(l=>l.students.includes(s.id)).length)))),detail(selS)))}
const addItem=(sid,type,text)=>{if(!text.trim())return;(S.items[sid]=S.items[sid]||[]).push({id:uid(),type,text:text.trim()});save();render()};
function marksRow(sid,d,sub,ls){const k=sid+'|'+d+'|'+sub,cur=S.marks[k]||{},sug=(S.ai[k]&&S.ai[k].marks)||suggest(ls,sid);

function detail(sid){
 const mine=S.lines.filter(l=>l.students.includes(sid)),g={};mine.forEach(l=>(g[l.date+'|'+l.subject]=g[l.date+'|'+l.subject]||[]).push(l));
 const type=h('select',{'aria-label':'Note type'},Object.entries(TYPES).map(([k,v])=>h('option',{value:k},v))),inp=h('input',{placeholder:'What did they learn, do well, or need next?'});
 const items=S.items[sid]||[];
 return h('div',{},
  h('div',{class:'card'},h('div',{class:'row',style:'align-items:center;justify-content:space-between;flex-wrap:wrap'},h('h2',{style:'margin:0'},nm(stu(sid))),
   h('div',{class:'seg'},[['dots','Dot jots'],['full','Full text']].map(([k,l])=>h('button',{class:S.mode===k?'on':'',onclick:()=>{S.mode=k;save();render()}},l)))),
   h('h3',{},'Anecdotal comments'),h('div',{class:'row'},type,inp,h('button',{class:'btn pri',onclick:()=>addItem(sid,type.value,inp.value)},'Add')),
   Object.keys(TYPES).map(k=>items.filter(i=>i.type===k).length?h('div',{},h('h3',{},TYPES[k]),items.filter(i=>i.type===k).map(itemRow)):null)),
  Object.keys(g).sort().reverse().map(key=>{const[d,sub]=key.split('|'),ls=g[key];
   return h('div',{class:'card'},h('div',{class:'row',style:'align-items:center;justify-content:space-between'},h('h2',{style:'margin:0'},fd(d)+' · '+sub),S.aiOn&&S.sync.url?h('button',{class:'btn sm noprint',onclick:()=>analyze(sid,d,sub,false)},S.ai[sid+'|'+d+'|'+sub]?'Re-run AI':'Analyze with AI'):null),marksRow(sid,d,sub,ls),h('p',{class:'note'},'Outlined dots are suggestions. Tap to confirm.'),aiPanel(sid,d,sub),
    ls.map(l=>h('div',{class:'ent'},h('span',{class:'b '+l.who},spk(l)),
     h('div',{class:'tx-t'},S.mode==='dots'?'• '+short(l.text):l.text,l.students.length>1?h('div',{class:'who'},'With '+l.students.filter(i=>i!==sid).map(i=>nm(stu(i))).join(', ')):null),
     h('button',{class:'btn sm',onclick:()=>addItem(sid,'S',S.mode==='dots'?short(l.text):l.text)},'+ Strength'),
     h('button',{class:'btn sm',onclick:()=>addItem(sid,'N',S.mode==='dots'?short(l.text):l.text)},'+ Next step'),
     h('button',{class:'icon noprint','aria-label':'Remove this line from '+nm(stu(sid)),title:'Remove from this student',onclick:()=>delLine(l.id,sid)},trash()))))}),
  mine.length?null:empty('No conversations yet. Notes appear here when this student is named.'))}
function itemRow(i){return h('div',{class:'item'},h('span',{},i.text),h('button',{class:'btn sm noprint','aria-label':'Delete',onclick:()=>{for(const k in S.items)S.items[k]=S.items[k].filter(x=>x.id!==i.id);save();render()}},'Delete'))}

/* ---------- parent call ---------- */
function vParent(m){
 if(!S.roster.length)return m.append(empty('Add your class list in Settings first.'));

 m.append(h('div',{class:'card row noprint',style:'align-items:center'},h('h2',{style:'margin:0;flex:none'},'Parent call'),sel,h('button',{class:'btn',onclick:()=>print()},'Print')),
  h('h2',{},nm(stu(selS))+' — '+fd(day())),

/* ---------- map ---------- */
function vMap(m){
 const cut=mapRange?new Date(Date.now()-mapRange*864e5).toLocaleDateString('en-CA'):'',cnt={},ed={};
 S.lines.filter(l=>l.date>=cut).forEach(l=>l.students.forEach(a=>{cnt[a]=(cnt[a]||0)+1;l.students.forEach(b=>{if(a<b)ed[a+'|'+b]=(ed[a+'|'+b]||0)+1})}));
 const sel=h('select',{'aria-label':'Time range',onchange:e=>{mapRange=+e.target.value;render()}},[[0,'All time'],[7,'Last 7 days'],[30,'Last 30 days']].map(([v,l])=>h('option',{value:v,selected:v===mapRange?'':null},l)));
 m.append(h('div',{class:'card'},h('div',{class:'row',style:'align-items:center'},h('h2',{style:'margin:0;flex:none'},'Connections'),sel),h('p',{class:'note'},'Lines join students who were in the same conversation. Thicker means more often. Bigger dots have more notes.')));
 if(!S.roster.length||!Object.keys(ed).length)return m.append(empty('The map appears once students have been grouped together in conversations.'));
 const n=S.roster.length,pos={};S.roster.forEach((s,i)=>{const a=i/n*Math.PI*2-Math.PI/2;pos[s.id]=[320+190*Math.cos(a),230+170*Math.sin(a)]});
 const svg=sv('svg',{viewBox:'0 0 640 460',role:'img','aria-label':'Student connection map',style:'width:100%;background:#fff;border:1px solid var(--line);border-radius:14px'});
 Object.entries(ed).forEach(([k,w])=>{const[a,b]=k.split('|');if(pos[a]&&pos[b])svg.append(sv('line',{x1:pos[a][0],y1:pos[a][1],x2:pos[b][0],y2:pos[b][1],stroke:'#0E7C86','stroke-opacity':.55,'stroke-width':Math.min(10,1+w)}))});
 S.roster.forEach(s=>{const[x,y]=pos[s.id],c=sv('g',{style:'cursor:pointer',tabindex:0});const go=()=>{selS=s.id;view='students';render()};c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter')go()};
  const t=sv('text',{x,y:y+(y<230?-16-Math.min(8,cnt[s.id]||0):24),'text-anchor':'middle'});t.textContent=nm(s);
  c.append(sv('circle',{cx:x,cy:y,r:7+Math.min(10,cnt[s.id]||0),fill:cnt[s.id]?'#0E7C86':'#B9C6CD'}),t);svg.append(c)});
 m.append(svg)}

/* ---------- settings ---------- */
function vSettings(m){
 const ta=h('textarea',{'aria-label':'Class list',placeholder:'One student per line. Use a first name and last initial, like Emily R.'},S.roster.map(s=>s.name).join('\n'));
 m.append(h('div',{class:'card'},h('h2',{},'Class list'),ta,h('p',{class:'note'},'One name per line. If two students share a first name, add a last initial to each.'),
  h('button',{class:'btn pri',onclick:()=>{const names=[...new Set(ta.value.split('\n').map(x=>x.trim()).filter(Boolean))].slice(0,60);
   const old=S.roster;S.roster=names.map(n=>old.find(r=>r.name===n)||{id:'',name:n});S.roster.forEach(r=>{if(!r.id)r.id=newId()});save();toast('Class list saved');render()}},'Save class list')),
 syncCard(),yearCard(),
 h('div',{class:'card'},h('h2',{},'Privacy'),
  h('p',{},'Notes stay in this browser unless you connect your Google Sheet. If the AI helper is on, student names are swapped for codes before any text leaves your browser. No audio is recorded or saved, only text, and text is only kept while capturing is on.'),
  h('p',{},'Chrome and Edge send microphone audio to their own speech service to turn it into text. Ask your school or district whether that is allowed before using real student names.'),
  h('label',{},h('input',{type:'checkbox',checked:S.hide?'':null,onchange:e=>{S.hide=e.target.checked;save();render()}}),' Show initials instead of names on screen'),
  h('div',{class:'row',style:'margin-top:14px;flex-wrap:wrap'},h('button',{class:'btn',onclick:exportCsv},'Export notes (CSV)'),
   h('button',{class:'btn',style:'color:var(--rec)',onclick:()=>{if(confirm('Delete all students, notes and marks from this device? This cannot be undone.')){S=fresh();save();active=[];selS=null;render()}}},'Delete all data'))))}
const stu2=n=>S.roster.find(r=>r.name===n);
function exportCsv(){const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},rows=[['date','subject','student','speaker','text']];
 S.lines.forEach(l=>(l.students.length?l.students:['']).forEach(id=>rows.push([l.date,l.subject,id?nm(stu(id)):'(unassigned)',l.who==='T'?'Teacher':(l.sp&&stu(l.sp)?'Student: '+stu(l.sp).name:'Student'),l.text])));
 h('a',{href:URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'})),download:'anecdotal-notes.csv'}).click()}
/* ---------- sheet + AI ---------- */
const lbl=id=>'Student '+(S.codes[id]||(S.codes[id]=++S.n));
const rest=t=>String(t||'').replace(/Student (\d+)/g,(m,n)=>{const id=Object.keys(S.codes).find(i=>S.codes[i]==n);return id&&stu(id)?nm(stu(id)):m});
function hide(t){const p=[];S.roster.forEach(s=>{const f=s.name.split(/\s+/)[0],dup=S.roster.filter(r=>r.name.split(/\s+/)[0].toLowerCase()===f.toLowerCase()).length>1;p.push([s.name.replace(/[.\s]+$/,''),lbl(s.id)]);if(!dup)p.push([f,lbl(s.id)])});
 p.sort((a,b)=>b[0].length-a[0].length).forEach(([k,c])=>t=t.replace(new RegExp('\\b'+esc(k)+'\\b','ig'),c));return t}
const netMsg=e=>e.name==='AbortError'?'The sheet took too long to answer. Wait a minute and try again.':"Can't reach the web app. Open the URL in a browser tab: you should see {\"ok\":true}. If not, set Who has access to Anyone and deploy again.";
async function api(action,extra){const c=new AbortController(),t=setTimeout(()=>c.abort(),45000);
 try{const r=await fetch(S.sync.url,{method:'POST',body:JSON.stringify(Object.assign({action,key:S.sync.key},extra)),signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
const setSync=t=>{$('#sync').textContent=t;const m=$('#syncmsg');if(m)m.textContent=t};
function queueSync(){if(syncing||!S.sync||!S.sync.url)return;clearTimeout(syncT);syncT=setTimeout(push,4000)}
async function push(){if(!S.sync.url)return toast('Add the web app URL in Settings first.');setSync('Saving to sheet…');
 try{const r=await api('push',{state:{roster:S.roster,lines:S.lines,marks:S.marks,items:S.items,ai:Object.assign({},S.ai,{__codes:{codes:S.codes,n:S.n}})}});
  setSync(r.error?'Sheet error: '+r.error:'Saved to sheet '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}catch(e){setSync(netMsg(e))}}
async function pull(){if(!S.sync.url)return toast('Add the web app URL in Settings first.');setSync('Loading from sheet…');
 try{const r=await api('pull');if(r.error){setSync('Sheet error: '+r.error);return}const st=r.state,ai=st.ai||{};
  if(ai.__codes){S.codes=ai.__codes.codes||{};S.n=ai.__codes.n||0;delete ai.__codes}
  syncing=true;Object.assign(S,{roster:st.roster,lines:st.lines,marks:st.marks,items:st.items,ai});migrateIds();save();syncing=false;active=[];selS=null;setSync('Loaded from sheet');render()}
 catch(e){syncing=false;setSync(netMsg(e))}}
async function analyze(sid,d,sub,quiet){
 if(!S.aiOn||!S.sync.url)return;const k=sid+'|'+d+'|'+sub,ls=S.lines.filter(l=>l.date===d&&l.subject===sub&&l.students.includes(sid));if(!ls.length)return;
 if(!quiet)toast('AI is reading the notes…');
 const payload={student:lbl(sid),subject:sub,lines:ls.map(l=>({who:l.who==='T'?'Teacher':'Student',speaker:l.sp?lbl(l.sp):undefined,text:hide(l.text)}))};
 try{const r=await api('analyze',{payload});if(r.error)return toast('AI: '+r.error);const a=r.result||{},arr=x=>Array.isArray(x)?x.map(String).slice(0,6):[],mk={};
  CATS.forEach(([c])=>mk[c]=Math.max(0,Math.min(4,Math.round(+(a.marks||{})[c]||0))));
  (a.speakers||[]).forEach((w,i)=>{if(ls[i]&&!ls[i].manual&&(w==='T'||w==='S')){ls[i].who=w;if(w==='T')delete ls[i].sp}});
  S.ai[k]={marks:mk,learned:arr(a.learned),strengths:arr(a.strengths),growth:arr(a.growth),next_steps:arr(a.next_steps),dots:arr(a.dots),full:String(a.full||''),n:ls.length,used:[]};
  save();view==='live'?renderLive():view==='students'&&render()}catch(e){toast('Could not reach the AI helper.')}}
async function autoAnalyze(){if(!S.aiOn||!S.sync||!S.sync.url)return;
 for(const s of S.roster){const ls=S.lines.filter(l=>l.date===day()&&l.subject===S.subject&&l.students.includes(s.id)),a=S.ai[s.id+'|'+day()+'|'+S.subject];
  if(ls.length&&(!a||a.n!==ls.length))await analyze(s.id,day(),S.subject,true)}}
function aiPanel(sid,d,sub){const a=S.ai[sid+'|'+d+'|'+sub];if(!a)return null;a.used=a.used||[];
 const rows=[];[['learned','L','Learned'],['strengths','S','Strength'],['growth','G','Growth'],['next_steps','N','Next step']].forEach(([f,t,lab])=>(a[f]||[]).forEach(x=>{if(!a.used.includes(x))rows.push({t,lab,x})}));
 return h('div',{class:'ai'},h('h3',{},'AI summary'),S.mode==='dots'?h('ul',{},(a.dots||[]).map(x=>h('li',{},rest(x)))):h('p',{},rest(a.full)),
  rows.length?h('h3',{},'Suggested comments'):null,
  rows.map(r=>h('div',{class:'item'},h('span',{},h('span',{class:'tag'},r.lab+': '),rest(r.x)),h('button',{class:'btn sm',onclick:()=>{a.used.push(r.x);addItem(sid,r.t,rest(r.x))}},'Add'))),
  rows.length>1?h('button',{class:'btn sm',style:'margin-top:8px',onclick:()=>{rows.forEach(r=>{a.used.push(r.x);(S.items[sid]=S.items[sid]||[]).push({id:uid(),type:r.t,text:rest(r.x)})});save();render()}},'Add all'):null)}
async function connect(url,key){S.sync={url:url.trim(),key:key.trim()};syncing=true;save();syncing=false;
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(S.sync.url))return setSync('The URL should start with https://script.google.com and end in /exec.');
 if(!S.sync.key)return setSync('Enter your passcode.');
 setSync('Connecting… the first try can take 10 to 20 seconds.');
 try{const r=await api('ping');
  if(r.error&&r.error!=='Unknown action')return setSync(r.error==='Wrong passcode'?'Wrong passcode. Tick Show passcode and check it matches the PASSCODE property exactly.':'Sheet error: '+r.error);
  setSync('Connected. Saving notes to the sheet…');await push()}catch(e){setSync(netMsg(e))}}
function syncCard(){const u=h('input',{placeholder:'Web app URL (ends in /exec)','aria-label':'Web app URL',value:S.sync.url}),k=h('input',{type:'password',placeholder:'Passcode you made up','aria-label':'Passcode',value:S.sync.key});
 return h('div',{class:'card'},h('h2',{},'Google Sheet and AI helper'),h('div',{class:'row',style:'flex-wrap:wrap'},u,k),
  h('label',{style:'display:block;margin:10px 0 0'},h('input',{type:'checkbox',onchange:e=>{k.type=e.target.checked?'text':'password'}}),' Show passcode'),
  h('label',{style:'display:block;margin:6px 0 10px'},h('input',{type:'checkbox',checked:S.aiOn?'':null,onchange:e=>{S.aiOn=e.target.checked;save()}}),' AI helper: sort notes into marks and comments'),
  h('div',{class:'row',style:'flex-wrap:wrap'},h('button',{class:'btn pri',onclick:()=>connect(u.value,k.value)},'Save and connect'),
   h('button',{class:'btn',onclick:push},'Save to sheet now'),h('button',{class:'btn',onclick:()=>confirm('Replace the notes on this device with the sheet?')&&pull()},'Load from sheet')),
  h('p',{id:'syncmsg',class:'note',role:'status'},''),
  h('p',{class:'note'},'Only the web app URL and the passcode go here. The Gemini key stays in the Apps Script, never in this page.'))}
/* ---------- delete lines ---------- */
const spk=l=>l.who==='T'?'Teacher':(l.sp&&stu(l.sp)?nm(stu(l.sp)):'Student');
const trash=()=>sv('svg',{viewBox:'0 0 24 24',width:18,height:18,fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'},sv('path',{d:'M3 6h18'}),sv('path',{d:'M8 6V4h8v2'}),sv('path',{d:'M6 6l1 14h10l1-14'}),sv('path',{d:'M10 11v6M14 11v6'}));
function delLine(id,sid){const i=S.lines.findIndex(l=>l.id===id);if(i<0)return;const l=S.lines[i],snap=JSON.stringify(l),shared=sid&&l.students.length>1,
 keys=(shared?[sid]:l.students).map(x=>x+'|'+l.date+'|'+l.subject),savedAi={};
 keys.forEach(k=>{if(S.ai[k]){savedAi[k]=S.ai[k];delete S.ai[k]}});
 if(shared)l.students=l.students.filter(x=>x!==sid);else S.lines.splice(i,1);
 const redraw=()=>view==='live'?renderLive():render();save();redraw();
 toast(shared?'Removed from '+nm(stu(sid))+'’s notes. It stays for the rest of the group.':'Deleted.',()=>{const o=JSON.parse(snap),j=S.lines.findIndex(x=>x.id===id);
  if(j>=0)S.lines[j]=o;else S.lines.splice(Math.min(i,S.lines.length),0,o);Object.assign(S.ai,savedAi);save();redraw()})}
/* ---------- student IDs: STU-26-001, STU-26-002, ... ---------- */
const ID_RE=/^STU-\d\d-\d{3}$/;
function newId(){S.idYear=S.idYear||String(schoolYear()).slice(2);
 let n=S.idLast||0;S.roster.forEach(r=>{const m=/^STU-\d\d-(\d{3})$/.exec(r.id||'');if(m)n=Math.max(n,+m[1])});
 S.idLast=n+1;return 'STU-'+S.idYear+'-'+String(n+1).padStart(3,'0')}
function migrateIds(){const map={};S.roster.forEach(r=>{if(!ID_RE.test(r.id)){const o=r.id;r.id=newId();map[o]=r.id}});
 if(!Object.keys(map).length)return false;const m=i=>map[i]||i,rk=(o,f)=>{const n={};for(const k in o)n[f(k)]=o[k];return n},mk=k=>{const p=k.split('|');p[0]=m(p[0]);return p.join('|')};
 S.lines.forEach(l=>l.students=l.students.map(m));S.marks=rk(S.marks,mk);S.ai=rk(S.ai,mk);S.items=rk(S.items,m);S.codes=rk(S.codes,m);
 active=active.map(m);if(selS)selS=m(selS);return true}
/* ---------- school year ---------- */
const schoolYear=()=>{const d=new Date();return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1};
const yearLabel=y=>y+'–'+String(y+1).slice(2);
const newYearDue=()=>S.idYear&&S.roster.length&&String(schoolYear()).slice(2)!==S.idYear;
function startNewYear(){const y=schoolYear();
 if(!confirm('Start the '+yearLabel(y)+' school year?\n\nThis downloads a copy of this year\'s notes, then clears all students and notes from this device and restarts student numbers at 001.\n\nIt also disconnects from the current Google Sheet so last year\'s sheet is not changed. Tip: in Google Sheets, use File > Make a copy to keep it.'))return;
 exportCsv();
 const keep={aiOn:S.aiOn,subject:S.subject,mode:S.mode,hide:S.hide};
 S=Object.assign(fresh(),keep);active=[];selS=null;save();setSync('');view='settings';render();
 toast('New year started. Add your class list, then connect a new sheet.')}
const yearBanner=()=>h('div',{class:'card noprint',style:'border-left:5px solid var(--s)'},
 h('p',{style:'margin:0 0 10px'},'A new school year has started ('+yearLabel(schoolYear())+'). Start fresh so student numbers return to 001.'),
 h('button',{class:'btn pri sm',onclick:startNewYear},'Start new school year'));
function yearCard(){const yy=S.idYear||String(schoolYear()).slice(2),next='STU-'+yy+'-'+String((S.idLast||0)+1).padStart(3,'0');
 return h('div',{class:'card'},h('h2',{},'School year'),
  h('p',{},'Student numbers for this class look like STU-'+yy+'-001. The next new student gets '+next+'.'),
  h('button',{class:'btn',onclick:startNewYear},'Start new school year'),
  h('p',{class:'note'},'Downloads a copy of this year\'s notes, clears the app, and restarts numbering at 001. It does not touch your Google Sheet.'))}
if(migrateIds())save();
render();
</script></body></html>
